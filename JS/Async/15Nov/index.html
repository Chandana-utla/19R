<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asynchronous JavaScript Examples</title>
    <style>
        #colorBox {
            width: 200px;
            height: 200px;
            background-color: red;
            margin: 20px;
        }
        #countdown, #clock {
            font-size: 24px;
            margin: 20px;
        }
        #output {
            font-size: 18px;
            color: blue;
            margin-top: 10px;
        }
    </style>
</head>
<body>
   
    <button id="callbackBtn">Run Callback Example</button>
    <div id="output"></div>
    

    <h2>setInterval Examples</h2>
    <div id="countdown">10</div>
    <button id="startCountdown">Start Countdown</button>
    <div id="clock"></div>
    
    <script>
    
        function doSomething(callback) {
            document.getElementById("output").textContent = "Task started...";
            setTimeout(() => {
                document.getElementById("output").textContent = "Task completed!";
                callback();
            }, 3000);
        }
        document.getElementById("callbackBtn").addEventListener("click", () => {
            doSomething(() => {
                document.getElementById("output").textContent += " Callback executed after task completion.";
            });
        });

  
        document.getElementById("startCountdown").addEventListener("click", () => {
            let count = 10;
            const countdownElement = document.getElementById("countdown");
            countdownElement.textContent = count;
            
            const interval = setInterval(() => {
                count--;
                countdownElement.textContent = count;
                if (count === 0) {
                    clearInterval(interval);
                    countdownElement.textContent = "Time's up!";
                }
            }, 1000);
        });
        
       
    </script>
</body>
</html>
